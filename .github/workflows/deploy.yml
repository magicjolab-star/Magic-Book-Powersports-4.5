name: Magic Book V6 Web Deploy

on:
  workflow_dispatch:

concurrency:
  group: magic-book-v6-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_TEAM_ID: team_iotcIMgEQ899STOO1HtZjTFK
  VERCEL_ORG_ID: team_iotcIMgEQ899STOO1HtZjTFK
  VERCEL_PROJECT_NAME: magic-book-powersports-v6-golden-master
  V6_SOURCE_DIR: v6-golden-master

jobs:
  deploy:
    name: Deploy isolated V6 Golden Master
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V6 branch
        uses: actions/checkout@v4

      - name: Validate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v6-golden-master-v460"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate V6 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$V6_SOURCE_DIR/index-360.html"
          test -f "$V6_SOURCE_DIR/premium-360.js"
          test -f "$V6_SOURCE_DIR/app-330.js"
          test -f "$V6_SOURCE_DIR/flow-core-361.js"
          grep -q '6.0.0' package.json
          grep -q 'com.magicproduction.magicbook' capacitor.config.ts
          if grep -R --line-number --fixed-strings 'com.magicjolab.magicbook'             --exclude-dir=.git             --exclude-dir=node_modules             --exclude-dir=dist             --exclude-dir=release             .; then
            echo "::error::Legacy Android application ID still exists."
            exit 1
          fi

      - name: Prepare isolated static deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v6-vercel
          mkdir -p .v6-vercel
          cp -a "$V6_SOURCE_DIR"/. .v6-vercel/
          cp "$V6_SOURCE_DIR/index-360.html" .v6-vercel/index.html
          for asset in footer-logo.png app-icon.png favicon.png splash-video.mp4; do
            if [ -f "$asset" ] && [ ! -f ".v6-vercel/$asset" ]; then
              cp "$asset" ".v6-vercel/$asset"
            fi
          done

      - name: Validate Vercel token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v2/user" >/dev/null

      - name: Ensure isolated Vercel project
        id: project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_API="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID"
          CODE="$(curl --silent --show-error             --output /tmp/project.json             --write-out "%{http_code}"             -H "Authorization: Bearer $VERCEL_TOKEN"             "$PROJECT_API")"

          if [ "$CODE" = "404" ]; then
            CODE="$(curl --silent --show-error               --output /tmp/project.json               --write-out "%{http_code}"               --request POST               "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID"               -H "Authorization: Bearer $VERCEL_TOKEN"               -H "Content-Type: application/json"               --data "{"name":"$VERCEL_PROJECT_NAME","framework":null}")"
          fi

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            cat /tmp/project.json || true
            exit 1
          fi

          PROJECT_ID="$(jq -r '.id // empty' /tmp/project.json)"
          test -n "$PROJECT_ID"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Disable Vercel Authentication
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --request PATCH             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data '{"ssoProtection":null,"framework":null}'             >/tmp/project-updated.json
          test "$(jq -r '.ssoProtection' /tmp/project-updated.json)" = "null"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Link isolated V6 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v6-vercel/.vercel
          cat > .v6-vercel/.vercel/project.json <<JSON
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          JSON

      - name: Deploy V6 production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(vercel deploy             --cwd .v6-vercel             --prod             --yes             --token="$VERCEL_TOKEN"             --scope="$VERCEL_ORG_ID" | tail -n 1)"
          [[ "$URL" == https://* ]]
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify V6 HTTP
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for attempt in {1..18}; do
            CODE="$(curl --silent --location               --output /tmp/v6.html               --write-out "%{http_code}"               "$URL/")"
            if [ "$CODE" = "200" ]; then
              grep -q 'Magic Book' /tmp/v6.html
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Magic Book V6 web deployment"
            echo
            echo "- Branch: `$GITHUB_REF_NAME`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Project: `$VERCEL_PROJECT_NAME`"
            echo "- URL: ${{ steps.deploy.outputs.url || 'deployment failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
